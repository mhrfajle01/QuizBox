<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </symbol>
      <symbol id="icon-volume-up" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.647 11 4.1 11 5v14c0 .9-.077 1.353-.293 1.569l-4.707-4.707z"></path>
      </symbol>
      <symbol id="icon-volume-off" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.647 11 4.1 11 5v14c0 .9-.077 1.353-.293 1.569l-4.707-4.707zm0 0L9.414 9m3.536-3.536l-1.414 1.414M17.586 10.414l-1.414 1.414m-1.414 1.414l-1.414 1.414M12 12l-1.414 1.414"></path>
      </symbol>
    </svg>
    <main class="container">
        <header class="main-header">
            <h1 id="quiz-main-title">Quiz Game</h1>
            <!-- Theme Toggle Switch -->
            <div class="toggle-switch-container">
                <div class="toggle-switch">
                    <input type="checkbox" id="theme-toggle-checkbox">
                    <span class="slider"></span>
                </div>
                <div class="theme-icons">
                    <svg class="icon" id="sun-icon"><use xlink:href="#icon-sun"></use></svg>
                    <svg class="icon hidden" id="moon-icon"><use xlink:href="#icon-moon"></use></svg>
                </div>
            </div>
        </header>

        <!-- Home Page Section -->
        <section id="home-page" class="page active">
            <div class="form-group">
                <label for="user-name-input">Your Name:</label>
                <input type="text" id="user-name-input" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Quiz Type:</label>
                <div class="quiz-type-selection">
                    <input type="radio" id="quiz-type-bengali" name="quiz-type" value="bengali" checked>
                    <label for="quiz-type-bengali">বাংলা কুইজ</label>
                    <input type="radio" id="quiz-type-english" name="quiz-type" value="english">
                    <label for="quiz-type-english">English Vocabulary</label>
                </div>
            </div>
            <div class="form-group">
                <label for="category-select">Category:</label>
                <select id="category-select">
                    <option value="all">All</option>
                </select>
            </div>
            <div class="form-group difficulty-wrapper">
                <label for="difficulty-select">Difficulty:</label>
                <select id="difficulty-select">
                    <option value="all">All</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div class="form-group">
                <label for="num-questions-select">Number of Questions:</label>
                <select id="num-questions-select">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </div>
            <div class="form-group">
                <label for="time-per-question-input">Time per Question (seconds):</label>
                <input type="number" id="time-per-question-input" value="10" min="5" max="30">
            </div>
            <footer>
                <button id="start-quiz-btn" class="btn">Start Quiz</button>
                <button id="reset-game-data-btn" class="btn secondary">Reset Data</button>
            </footer>
        </section>

        <!-- Study Page Section -->
        <section id="study-page" class="page">
            <header>
                <h2>Get Ready! Study the syllabus...</h2>
            </header>
            <div class="study-timer-container">
                Time left to study: <span id="study-timer">30</span>s
            </div>
            <div id="study-content"></div>
            <footer>
                <button id="start-quiz-from-study-btn" class="btn">Start Now!</button>
            </footer>
        </section>

        <!-- Quiz Page Section -->
        <section id="quiz-page" class="page">
            <header class="quiz-header">
                <div id="question-counter">Question: <span id="current-q-num"></span>/<span id="total-q-num"></span></div>
                <div id="score-display">Score: <span id="current-score">0</span></div>
                <div id="timer">Time: <span id="time-left">10</span>s</div>
            </header>
            <div class="progress-bar-container">
                <div id="quiz-progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="lifelines">
                <button id="fifty-fifty-btn" class="lifeline-btn">50/50</button>
                <button id="skip-question-btn" class="lifeline-btn">Skip</button>
            </div>
            <div id="question-text"></div>
            <div id="feedback-message"></div>
            <div id="answer-buttons"></div>
            <footer class="quiz-footer">
                <button id="next-question-btn" class="btn hidden">Next Question</button>
            </footer>
        </section>

        <!-- Results Page Section -->
        <section id="results-page" class="page">
            <header>
                <h2>Quiz Complete!</h2>
            </header>
            <div class="results-summary">
                <p>Your Final Score:</p>
                <div class="score-circle-container">
                    <svg width="0" height="0">
                        <defs>
                          <linearGradient id="score-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:var(--primary-gloss-start);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:var(--primary-gloss-end);stop-opacity:1" />
                          </linearGradient>
                        </defs>
                      </svg>
                    <svg class="score-circle" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div id="final-score">0</div>
                </div>
            </div>
            <div class="score-details">
                <div class="detail-item">
                    <h3>Correct</h3>
                    <span id="correct-answers-count">0</span>
                </div>
                <div class="detail-item">
                    <h3>Incorrect</h3>
                    <span id="incorrect-answers-count">0</span>
                </div>
                <div class="detail-item">
                    <h3>Unanswered</h3>
                    <span id="unanswered-questions-count">0</span>
                </div>
                <div class="detail-item">
                    <h3>Avg. Time</h3>
                    <span id="average-time-per-question">0s</span>
                </div>
                <div class="detail-item">
                    <h3>Streak Bonus</h3>
                    <span id="streak-bonus-score">0</span>
                </div>
                <div class="detail-item">
                    <h3>Time Bonus</h3>
                    <span id="time-bonus-score">0</span>
                </div>
            </div>
            <div id="incorrect-answers-review"></div>
            <footer class="results-actions">
                <button id="restart-quiz-btn" class="btn">Play Again</button>
                <button id="share-score-btn" class="btn secondary">Share Score</button>
                <button id="go-home-btn" class="btn">Go Home</button>
            </footer>
        </section>

        <!-- Global Loading Indicator -->
        <div id="loading-indicator" class="loading-indicator hidden">
            <div class="spinner"></div>
        </div>

        <!-- Universal Modal Component -->
        <div id="modal-container" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">Modal Title</h2>
                <p id="modal-text">Modal message goes here.</p>
                <div class="modal-buttons">
                    <button id="modal-confirm-btn" class="btn">Confirm</button>
                    <button id="modal-copy-btn" class="btn secondary">Copy</button>
                    <button id="modal-cancel-btn" class="btn">Cancel</button>
                </div>
            </div>
        </div>
        
        <!-- Bottom Utility Bar for Mute Toggle -->
        <div class="utility-bar-bottom">
            <div class="toggle-switch-container">
                <div class="toggle-switch">
                    <input type="checkbox" id="mute-toggle-checkbox">
                    <span class="slider"></span>
                </div>
                <div class="mute-icons">
                    <svg class="icon" id="volume-up-icon"><use xlink:href="#icon-volume-up"></use></svg>
                    <svg class="icon hidden" id="volume-off-icon"><use xlink:href="#icon-volume-off"></use></svg>
                </div>
            </div>
        </div>
    </main>

    <!-- External JavaScript files -->
    <script src="js/app.js" type="module"></script>
</body>
</html>
